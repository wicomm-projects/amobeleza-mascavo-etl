name: CI

on:
    pull_request:
        branches: [develop, main]
    push:
        branches: [develop]

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
            # MySQL LOCAL do docker-compose, só dentro do runner: prova as travas no servidor real.
            - run: docker compose up -d --wait
            - run: npm run test:integration
            - if: always()
              run: docker compose down -v
